name: DeepEval Regression Suite

# Runs the Phase 03 DeepEval test harness on every pull request and reports
# pass/fail as a PR status check. This is the merge-gate pattern described in
# the Production Deployment Architecture section of the Project 2 README:
# an agent's code changes cannot merge unless the governance-tagged test
# suite passes.
#
# Status: written and structurally correct, not yet run against a live
# repository secret set. GOOGLE_API_KEY and ANTHROPIC_API_KEY below are
# read from GitHub Actions repository secrets, never committed to the repo.
# This workflow has not yet executed end to end in CI, pending funded API
# credits for both providers.
#
# permissions block added after a real, confirmed 403 Forbidden error:
# EnricoMi/publish-unit-test-result-action needs explicit write access to
# create a check run. GitHub Actions' default token is read-only unless a
# workflow grants more, documented in the action's own README.

on:
  pull_request:
    branches: [main]
    paths:
      - "project-2-llm-evaluation-suite/**"
  workflow_dispatch: {}

permissions:
  checks: write
  pull-requests: write
  contents: read

jobs:
  deepeval-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest deepeval google-genai anthropic langfuse

      - name: Run DeepEval governance regression suite
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
        run: |
          deepeval test run project-2-llm-evaluation-suite/tests/test_governance_suite.py \
            --junitxml=deepeval-results.xml

      - name: Publish test results as PR status check
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: deepeval-results.xml

      - name: Upload full results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepeval-regression-results
          path: deepeval-results.xml
